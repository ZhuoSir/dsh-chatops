<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system,'PingFang SC',system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#979da6"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f5f6f7;stroke:#d4d4d4;rx:10}
    .im{fill:#fff;stroke:#cfd3d6}
    .core{fill:#edf3fe;stroke:#679efe}
    .t{font-size:14px;fill:#1b1b1c;font-weight:600}
    .s{font-size:11.5px;fill:#7f8287}
    .c{font-size:12px;fill:#4176e6;font-weight:600}
  </style>

  <!-- IM users -->
  <rect class="box im" x="20" y="30" width="150" height="56" rx="10"/>
  <text class="t" x="40" y="54">微信</text><text class="s" x="40" y="72">ClawBot · iLink</text>
  <rect class="box im" x="20" y="106" width="150" height="56" rx="10"/>
  <text class="t" x="40" y="130">飞书</text><text class="s" x="40" y="148">自建应用 · WS</text>
  <rect class="box im" x="20" y="182" width="150" height="56" rx="10"/>
  <text class="t" x="40" y="206">钉钉</text><text class="s" x="40" y="224">企业应用 · Stream</text>
  <rect class="box im" x="20" y="258" width="150" height="56" rx="10"/>
  <text class="t" x="40" y="282">企业微信</text><text class="s" x="40" y="300">智能机器人 · WS</text>

  <!-- arrows to plugin -->
  <line x1="170" y1="58" x2="285" y2="150" stroke="#979da6" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="170" y1="134" x2="285" y2="170" stroke="#979da6" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="170" y1="210" x2="285" y2="195" stroke="#979da6" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="170" y1="286" x2="285" y2="215" stroke="#979da6" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- plugin core -->
  <rect class="box core" x="290" y="105" width="190" height="135" rx="12"/>
  <text class="t" x="380" y="132" text-anchor="middle">dsh-chatops</text>
  <text class="s" x="380" y="152" text-anchor="middle">ChannelManager 多通道路由</text>
  <text class="s" x="380" y="170" text-anchor="middle">SessionBridge 指令/审批/文件</text>
  <text class="s" x="380" y="188" text-anchor="middle">owner 白名单 + 审计</text>
  <text class="c" x="380" y="214" text-anchor="middle">均为主动出站 · 零公网部署</text>

  <!-- arrow to DSH -->
  <line x1="480" y1="172" x2="565" y2="172" stroke="#979da6" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- DSH -->
  <rect class="box" x="570" y="105" width="170" height="135" rx="12" style="fill:#e6faed;stroke:#4ed17e"/>
  <text class="t" x="655" y="145" text-anchor="middle">DeepSeek Harness</text>
  <text class="s" x="655" y="165" text-anchor="middle">全部工作区 / 会话</text>
  <text class="s" x="655" y="183" text-anchor="middle">审批 answerer</text>
  <text class="s" x="655" y="201" text-anchor="middle">im_send_file 工具</text>
</svg>
